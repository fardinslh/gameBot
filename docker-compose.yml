services:
  postgres:
    image: postgres:17-alpine
    container_name: crown-and-coin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crown_and_coin
      POSTGRES_USER: crown
      POSTGRES_PASSWORD: crown_dev
    ports:
      - "5432:5432"
    volumes:
      - crown_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crown -d crown_and_coin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: crown-and-coin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - crown_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crown_postgres_data:
  crown_redis_data:
